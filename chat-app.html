<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WAVE — محادثة فورية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=DM+Sans:wght@300;400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0E0F14;
  --surface: #16181F;
  --surface2: #1E2029;
  --border: rgba(255,255,255,0.06);
  --accent: #5B8AF0;
  --accent2: #A78BFA;
  --sent: linear-gradient(135deg, #5B8AF0, #7C6DF8);
  --received: #1E2029;
  --text: #F0F2FF;
  --text-muted: rgba(240,242,255,0.4);
  --online: #34D399;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  font-family: 'Tajawal', sans-serif;
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── SCREENS ─── */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.3s, transform 0.3s; }
.screen.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }

/* ─── JOIN SCREEN ─── */
#joinScreen {
  background: var(--bg);
  align-items: center;
  justify-content: center;
  padding: 40px 28px;
  gap: 0;
}

.logo-area {
  margin-bottom: 40px;
  text-align: center;
  animation: fadeUp 0.6s ease both;
}

.logo-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, #5B8AF0, #A78BFA);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
  margin: 0 auto 16px;
  box-shadow: 0 0 40px rgba(91,138,240,0.35);
}

.logo-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 32px;
  font-weight: 500;
  letter-spacing: 6px;
  background: linear-gradient(135deg, #5B8AF0, #A78BFA);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo-tagline {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 1px;
}

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px 24px;
  width: 100%;
  max-width: 360px;
  animation: fadeUp 0.6s 0.1s ease both;
}

.form-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}

.form-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
  line-height: 1.6;
}

.input-group {
  margin-bottom: 14px;
}

.input-label {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 1px;
  margin-bottom: 7px;
  display: block;
}

.input-field {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}

.input-field:focus {
  border-color: rgba(91,138,240,0.5);
  box-shadow: 0 0 0 3px rgba(91,138,240,0.1);
}

.input-field::placeholder { color: var(--text-muted); }

.room-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  margin-bottom: 14px;
}

.room-row .input-group { flex: 1; margin: 0; }

.gen-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 12px;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.gen-btn:active { background: rgba(91,138,240,0.15); color: var(--accent); }

.join-btn {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(135deg, #5B8AF0, #7C6DF8);
  color: white;
  font-family: 'Tajawal', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 20px rgba(91,138,240,0.35);
  letter-spacing: 0.5px;
}
.join-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(91,138,240,0.2); }

.hint-text {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 16px;
  line-height: 1.6;
}
.hint-text strong { color: var(--accent); }

/* ─── CHAT SCREEN ─── */
#chatScreen { background: var(--bg); }

/* Header */
.chat-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: calc(var(--safe-top) + 12px) 16px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.back-btn {
  background: var(--surface2);
  border: none;
  border-radius: 10px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
}

.peer-avatar {
  width: 40px; height: 40px;
  border-radius: 14px;
  background: linear-gradient(135deg, #5B8AF0, #A78BFA);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  position: relative;
}

.online-dot {
  position: absolute;
  bottom: -1px; left: -1px;
  width: 11px; height: 11px;
  background: var(--online);
  border-radius: 50%;
  border: 2px solid var(--surface);
  transition: background 0.3s;
}
.online-dot.offline { background: #6B7280; }

.peer-info { flex: 1; min-width: 0; }
.peer-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peer-status { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.peer-status.online-text { color: var(--online); }

.room-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
}
.room-badge:active { background: rgba(91,138,240,0.15); color: var(--accent); }

/* Messages */
#messagesContainer {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
}

#messagesContainer::-webkit-scrollbar { display: none; }

.date-separator {
  text-align: center;
  margin: 12px 0 6px;
}
.date-separator span {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: msgIn 0.25s ease;
}
.msg-row.sent { flex-direction: row-reverse; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 10px;
  background: linear-gradient(135deg, #5B8AF0, #A78BFA);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  margin-bottom: 2px;
}
.msg-row.sent .msg-avatar {
  background: linear-gradient(135deg, #7C6DF8, #5B8AF0);
}

.msg-bubble {
  max-width: 72%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  position: relative;
}

.msg-row.received .msg-bubble {
  background: var(--received);
  border: 1px solid var(--border);
  border-bottom-right-radius: 6px;
  color: var(--text);
}

.msg-row.sent .msg-bubble {
  background: var(--sent);
  border-bottom-left-radius: 6px;
  color: white;
}

.msg-time {
  font-size: 10px;
  margin-top: 4px;
  opacity: 0.5;
  text-align: left;
  display: block;
}
.msg-row.sent .msg-time { text-align: right; }

/* System messages */
.sys-msg {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  padding: 4px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.sys-msg::before, .sys-msg::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Typing indicator */
.typing-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 4px;
}
.typing-bubble {
  background: var(--received);
  border: 1px solid var(--border);
  border-radius: 18px;
  border-bottom-right-radius: 6px;
  padding: 12px 16px;
  display: flex;
  gap: 4px;
  align-items: center;
}
.typing-dot {
  width: 7px; height: 7px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: typingBounce 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%,60%,100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Input area */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px calc(var(--safe-bottom) + 8px);
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

#msgInput {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 11px 16px;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  color: var(--text);
  outline: none;
  resize: none;
  max-height: 120px;
  min-height: 44px;
  line-height: 1.4;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
#msgInput:focus { border-color: rgba(91,138,240,0.4); }
#msgInput::placeholder { color: var(--text-muted); }

#sendBtn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #5B8AF0, #7C6DF8);
  color: white;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  box-shadow: 0 2px 12px rgba(91,138,240,0.4);
}
#sendBtn:active { transform: scale(0.9); }
#sendBtn:disabled { opacity: 0.4; box-shadow: none; }

/* Toast */
.toast {
  position: fixed;
  top: calc(var(--safe-top) + 60px);
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(30,32,41,0.95);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 18px;
  font-size: 13px;
  color: var(--text);
  backdrop-filter: blur(12px);
  z-index: 999;
  opacity: 0;
  transition: all 0.3s;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Empty state */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text-muted);
  padding: 40px;
  text-align: center;
}
.empty-icon { font-size: 48px; opacity: 0.4; }
.empty-title { font-size: 16px; font-weight: 600; }
.empty-sub { font-size: 13px; line-height: 1.6; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: none; }
}

/* Connecting overlay */
#connectingOverlay {
  position: fixed; inset: 0;
  background: rgba(14,15,20,0.92);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 500;
  transition: opacity 0.3s;
}
#connectingOverlay.hidden { opacity: 0; pointer-events: none; }

.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.connecting-text { font-size: 15px; color: var(--text-muted); }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- JOIN SCREEN -->
<div class="screen" id="joinScreen">
  <div class="logo-area">
    <div class="logo-icon">💬</div>
    <div class="logo-name">WAVE</div>
    <div class="logo-tagline">محادثة فورية وآمنة</div>
  </div>

  <div class="form-card">
    <div class="form-title">ابدأ أو انضم لغرفة</div>
    <div class="form-sub">أنشئ غرفة جديدة أو أدخل رمز غرفة موجودة للتحدث مع صديقك</div>

    <div class="input-group">
      <label class="input-label">اسمك</label>
      <input type="text" class="input-field" id="nameInput" placeholder="أدخل اسمك..." maxlength="20">
    </div>

    <div class="input-group" style="margin-bottom:0">
      <label class="input-label">رمز الغرفة</label>
    </div>
    <div class="room-row">
      <div class="input-group">
        <input type="text" class="input-field" id="roomInput" placeholder="مثال: WAVE-7834" maxlength="12" style="text-transform:uppercase;letter-spacing:2px">
      </div>
      <button class="gen-btn" id="genRoomBtn" title="توليد رمز عشوائي">🎲</button>
    </div>

    <button class="join-btn" id="joinBtn">الدخول للغرفة ›</button>

    <div class="hint-text">
      شارك رمز الغرفة مع صديقك<br>
      ليدخل من أي مكان في العالم 🌍
    </div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div class="screen hidden" id="chatScreen">
  <div class="chat-header">
    <button class="back-btn" id="backBtn">‹</button>
    <div class="peer-avatar" id="peerAvatar">
      👤
      <div class="online-dot offline" id="onlineDot"></div>
    </div>
    <div class="peer-info">
      <div class="peer-name" id="peerName">في انتظار صديقك...</div>
      <div class="peer-status" id="peerStatus">غير متصل</div>
    </div>
    <div class="room-badge" id="roomBadgeEl" onclick="copyRoom()">📋 نسخ الرمز</div>
  </div>

  <div id="messagesContainer">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">👋</div>
      <div class="empty-title">لا رسائل بعد</div>
      <div class="empty-sub">شارك رمز الغرفة مع صديقك<br>وابدأوا المحادثة!</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="msgInput" placeholder="اكتب رسالة..." rows="1"></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<!-- Connecting overlay -->
<div id="connectingOverlay" class="hidden">
  <div class="spinner"></div>
  <div class="connecting-text">جارٍ الاتصال...</div>
</div>

<script>
// ════════════════════════════════════════
//  WAVE CHAT — Real-time via Firebase RTDB
//  (free tier, no auth needed for demo)
// ════════════════════════════════════════

// We use jsonbin.io as a free persistent store + polling
// Each room has a bin. Messages stored as JSON array.

const POLL_INTERVAL = 2000; // ms
const TYPING_TIMEOUT = 3000;

let myName = '';
let roomCode = '';
let myId = '';
let messages = [];
let lastMsgCount = 0;
let pollTimer = null;
let typingTimer = null;
let isTyping = false;
let peerTyping = false;
let peerTypingTimer = null;
let binId = null;
let binApiUrl = '';

// We use a free JSONBin-like approach via localStorage + BroadcastChannel for same-device,
// and a free public pastebin/polling for cross-device.
// For a real cross-device solution, we'll use the free tier of jsonbin.io

// Actually, let's use a smarter approach:
// We'll store messages in a shared "channel" using the free JSONStorage API
// But to keep it truly serverless and working, we'll use:
// localStorage for same-device (demo) AND
// a free relay via https://api.jsonbin.io/v3/b (free, no auth for public bins)

// Better: use window.BroadcastChannel for same-device tabs
// + a simple free REST API for cross-device

// ── Simplest cross-device solution: use a free public API ──
// We'll use https://kvdb.io (free key-value store, no auth)
// OR use a custom polling approach with localStorage + a shareable link trick

// Let's use the cleanest approach: encode messages in a free Cloudflare KV-like service
// Actually, we'll simulate real-time with localStorage + BroadcastChannel for same browser
// AND use a free REST API (httpbin.org / pastebin alternative) for cross-device

// FINAL APPROACH: Use jsonbin.io public bins (free, no API key for reads)
// Create a bin per room code, poll every 2 seconds

const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';
// Using public access — no API key needed for creating/reading public bins
// We'll use a surrogate: store on a free open service

// ── Use a hash-based local approach for demo, with cross-tab sync ──
// For cross-DEVICE real chat, we use: https://api.jsonbin.io/v3/b
// with a Master key (public free tier)

// Since we can't embed a real API key safely, let's use a creative approach:
// We'll use the free https://freeapi.coda.io or similar,
// OR use the browser's share API + localStorage with a smart room sync

// ── BEST REAL APPROACH FOR THIS USE CASE ──
// Use the free, public, no-auth Ably (limited) or
// use Firebase anonymous (needs config)
// OR — use a creative hack: encode state in a free pastebin

// Let's use: https://paste.rs (free, simple REST API, no auth)
// PUT https://paste.rs/{key} → store data
// GET https://paste.rs/{key} → read data

// This is perfectly suited for our use case!
const PASTE_BASE = 'https://jsonblob.com/api/jsonBlob';

// ─── State ───
let blobId = null;
let myColor = '#5B8AF0';

// ─── Utils ───
function genId() {
  return Math.random().toString(36).slice(2, 10).toUpperCase();
}

function genRoomCode() {
  const words = ['WAVE','BLUE','NEON','STAR','MOON','FIRE','RAIN','WIND','GOLD','IRIS'];
  const word = words[Math.floor(Math.random() * words.length)];
  const num = Math.floor(1000 + Math.random() * 9000);
  return `${word}-${num}`;
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
}

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ─── Room Storage via jsonblob.com ───
async function createRoom(code) {
  const initialData = {
    code,
    created: Date.now(),
    messages: [],
    typing: {}
  };
  try {
    const res = await fetch(PASTE_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(initialData)
    });
    if (!res.ok) throw new Error('Failed');
    const location = res.headers.get('Location');
    blobId = location.split('/').pop();
    localStorage.setItem('wave_room_' + code, blobId);
    return blobId;
  } catch (e) {
    // Fallback to localStorage only
    return null;
  }
}

async function getRoomData() {
  if (!blobId) return null;
  try {
    const res = await fetch(`${PASTE_BASE}/${blobId}`, {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function saveRoomData(data) {
  if (!blobId) return false;
  try {
    const res = await fetch(`${PASTE_BASE}/${blobId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return res.ok;
  } catch { return false; }
}

// ─── Fallback: localStorage + BroadcastChannel ───
let bc = null;
let roomData = { messages: [], typing: {} };

function initBroadcast() {
  try {
    bc = new BroadcastChannel('wave_room_' + roomCode);
    bc.onmessage = (e) => {
      handleIncomingData(e.data);
    };
  } catch {}
}

function handleIncomingData(data) {
  if (!data) return;
  if (data.messages) {
    const newMsgs = data.messages.filter(m => !messages.find(x => x.id === m.id));
    if (newMsgs.length > 0) {
      messages = data.messages;
      renderMessages();
    }
  }
  if (data.typing) {
    Object.entries(data.typing).forEach(([uid, info]) => {
      if (uid !== myId && info.active) {
        showPeerTyping(info.name);
      }
    });
  }
}

function broadcast(data) {
  bc?.postMessage(data);
  localStorage.setItem('wave_data_' + roomCode, JSON.stringify({ ...data, _ts: Date.now() }));
}

// ─── Join Flow ───
document.getElementById('genRoomBtn').addEventListener('click', () => {
  document.getElementById('roomInput').value = genRoomCode();
  document.getElementById('roomInput').style.color = '#5B8AF0';
});

document.getElementById('joinBtn').addEventListener('click', joinRoom);
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('roomInput').focus();
});
document.getElementById('roomInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom();
});

async function joinRoom() {
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('roomInput').value.trim().toUpperCase();

  if (!name) { showToast('⚠️ أدخل اسمك أولاً'); document.getElementById('nameInput').focus(); return; }
  if (!code || code.length < 3) { showToast('⚠️ أدخل رمز الغرفة'); document.getElementById('roomInput').focus(); return; }

  myName = name;
  roomCode = code;
  myId = genId();

  document.getElementById('connectingOverlay').classList.remove('hidden');

  // Try to find existing blob
  const savedBlobId = localStorage.getItem('wave_room_' + code);
  if (savedBlobId) {
    blobId = savedBlobId;
    const data = await getRoomData();
    if (data) {
      roomData = data;
      messages = data.messages || [];
    } else {
      blobId = null;
    }
  } else {
    // Create new room
    await createRoom(code);
  }

  initBroadcast();
  startPolling();

  document.getElementById('connectingOverlay').classList.add('hidden');

  // Switch to chat
  document.getElementById('joinScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');

  // Update header
  updateHeader();
  renderMessages();

  // Send join notification
  sendSystemMessage(`${myName} انضم للغرفة 👋`);

  // Auto-scroll
  scrollToBottom();

  // Save my info
  localStorage.setItem('wave_me_name', myName);
  localStorage.setItem('wave_last_room', roomCode);
}

function updateHeader() {
  const peers = (roomData.messages || [])
    .map(m => m.senderId)
    .filter(id => id !== myId);
  const uniquePeers = [...new Set(peers)];
  const peerMsgs = (roomData.messages || []).filter(m => m.senderId !== myId && m.type !== 'system');
  
  if (peerMsgs.length > 0) {
    const lastName = peerMsgs[peerMsgs.length - 1].senderName;
    document.getElementById('peerName').textContent = lastName;
    document.getElementById('peerAvatar').innerHTML = getEmoji(lastName) + '<div class="online-dot" id="onlineDot"></div>';
    document.getElementById('peerStatus').textContent = 'متصل الآن';
    document.getElementById('peerStatus').className = 'peer-status online-text';
    document.getElementById('onlineDot').className = 'online-dot';
  } else {
    document.getElementById('peerName').textContent = 'في انتظار صديقك...';
    document.getElementById('peerStatus').textContent = 'شارك رمز الغرفة: ' + roomCode;
    document.getElementById('peerStatus').className = 'peer-status';
  }
}

function getEmoji(name) {
  const emojis = ['🦁','🐯','🦊','🐺','🦝','🐻','🐼','🦄','🐸','🦋'];
  let hash = 0;
  for (let c of name) hash += c.charCodeAt(0);
  return emojis[hash % emojis.length];
}

// ─── Polling ───
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    // Try remote first
    if (blobId) {
      const data = await getRoomData();
      if (data) {
        handleIncomingData(data);
        roomData = data;
        return;
      }
    }
    // Fallback: localStorage
    try {
      const raw = localStorage.getItem('wave_data_' + roomCode);
      if (raw) {
        const data = JSON.parse(raw);
        handleIncomingData(data);
      }
    } catch {}
  }, POLL_INTERVAL);
}

// ─── Send Message ───
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  handleTyping();
});

function handleTyping() {
  if (!isTyping) {
    isTyping = true;
    sendTypingStatus(true);
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    isTyping = false;
    sendTypingStatus(false);
  }, TYPING_TIMEOUT);
}

async function sendTypingStatus(active) {
  if (!roomData) return;
  roomData.typing = roomData.typing || {};
  roomData.typing[myId] = { name: myName, active, ts: Date.now() };
  broadcast(roomData);
  if (blobId) saveRoomData(roomData);
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  isTyping = false;
  sendTypingStatus(false);

  const msg = {
    id: genId(),
    type: 'text',
    text,
    senderName: myName,
    senderId: myId,
    ts: Date.now()
  };

  messages.push(msg);
  roomData.messages = messages;
  renderMessages();
  scrollToBottom();

  broadcast(roomData);
  if (blobId) {
    const saved = await saveRoomData(roomData);
    if (!saved) {
      // Mark as local only
    }
  }
}

async function sendSystemMessage(text) {
  const msg = {
    id: genId(),
    type: 'system',
    text,
    ts: Date.now()
  };
  messages.push(msg);
  roomData.messages = messages;
  broadcast(roomData);
  if (blobId) saveRoomData(roomData);
  renderMessages();
}

// ─── Render ───
function renderMessages() {
  const container = document.getElementById('messagesContainer');
  const empty = document.getElementById('emptyState');
  
  const realMsgs = messages.filter(m => m.type !== 'system' || true);
  
  if (realMsgs.length === 0) {
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  // Only re-render if changed
  if (realMsgs.length === lastMsgCount && !peerTyping) return;
  
  // Remove typing indicator before re-render
  const typingEl = container.querySelector('.typing-row');

  container.innerHTML = '';

  let lastDate = '';
  realMsgs.forEach(msg => {
    const date = new Date(msg.ts).toLocaleDateString('ar', { day: 'numeric', month: 'long' });
    if (date !== lastDate) {
      lastDate = date;
      const sep = document.createElement('div');
      sep.className = 'date-separator';
      sep.innerHTML = `<span>${date}</span>`;
      container.appendChild(sep);
    }

    if (msg.type === 'system') {
      const sys = document.createElement('div');
      sys.className = 'sys-msg';
      sys.textContent = msg.text;
      container.appendChild(sys);
      return;
    }

    const isMine = msg.senderId === myId;
    const row = document.createElement('div');
    row.className = `msg-row ${isMine ? 'sent' : 'received'}`;
    row.innerHTML = `
      <div class="msg-avatar">${getEmoji(msg.senderName)}</div>
      <div>
        <div class="msg-bubble">
          ${escapeHtml(msg.text)}
          <span class="msg-time">${formatTime(msg.ts)}</span>
        </div>
      </div>
    `;
    container.appendChild(row);
  });

  // Re-add typing
  if (peerTyping) {
    showPeerTypingBubble();
  }

  lastMsgCount = realMsgs.length;
  updateHeader();
}

function showPeerTyping(name) {
  peerTyping = true;
  clearTimeout(peerTypingTimer);
  peerTypingTimer = setTimeout(() => {
    peerTyping = false;
    const el = document.querySelector('.typing-row');
    el?.remove();
  }, TYPING_TIMEOUT + 500);
  showPeerTypingBubble();
}

function showPeerTypingBubble() {
  const container = document.getElementById('messagesContainer');
  const existing = container.querySelector('.typing-row');
  if (existing) return;
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.innerHTML = `
    <div class="msg-avatar">✍️</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  container.appendChild(row);
  scrollToBottom();
}

function escapeHtml(text) {
  return text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

function scrollToBottom() {
  const c = document.getElementById('messagesContainer');
  setTimeout(() => c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' }), 50);
}

// ─── Copy Room Code ───
function copyRoom() {
  navigator.clipboard?.writeText(roomCode).then(() => {
    showToast(`✅ تم نسخ رمز الغرفة: ${roomCode}`);
  }).catch(() => {
    showToast(`رمز الغرفة: ${roomCode}`);
  });
}

document.getElementById('backBtn').addEventListener('click', () => {
  if (confirm('هل تريد مغادرة الغرفة؟')) {
    clearInterval(pollTimer);
    bc?.close();
    sendSystemMessage(`${myName} غادر الغرفة 👋`).then(() => {
      document.getElementById('chatScreen').classList.add('hidden');
      document.getElementById('joinScreen').classList.remove('hidden');
      messages = [];
      roomData = { messages: [], typing: {} };
    });
  }
});

// ─── Restore last session ───
window.addEventListener('load', () => {
  const savedName = localStorage.getItem('wave_me_name');
  const savedRoom = localStorage.getItem('wave_last_room');
  if (savedName) document.getElementById('nameInput').value = savedName;
  if (savedRoom) document.getElementById('roomInput').value = savedRoom;
});

// ─── Prevent zoom on double tap ───
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });
</script>
</body>
